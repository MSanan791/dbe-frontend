name: Github actions demo
run-name: ${{guthub.actor}} is testing out github Actions.....
on: [push]
jobs:
  Explore-Github-Actions:
    runs-on: ubuntu-latest
    steps:
       - run: echo "this job is automatically triggered by a ${{github.event_name}} event."
       - run: echo "This job is now running on a ${{runner.os}} server hosted by github."
       - run: echo "The name of the brach is ${{github.ref}} and your repository is ${{github.repository}}."
       - name: Check out repository code
         uses: actions/checkout@v4
       - run: echo " The ${{github.repository}} repository has been cloned to the runner."
       - run: echo "The Workflow is now ready to test your code on the runner."
       - name: List files in the repository
         run: |
              ls ${{github.workspace}}
       - run: echo "This job status is ${{job.status}}." 
